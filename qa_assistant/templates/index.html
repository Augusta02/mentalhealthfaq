<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Mental Health FAQ Assistant</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; color: #222; }
        h2 { margin-bottom: 4px; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 20px; }
        #chat { border: 1px solid #ddd; border-radius: 8px; padding: 16px; height: 420px; overflow-y: auto; margin-bottom: 12px; background: #fafafa; }
        .msg { margin-bottom: 16px; }
        .msg .who { font-weight: bold; margin-bottom: 4px; }
        .msg.user .who { color: #0b4f4a; }
        .msg.assistant .who { color: #333; }
        .msg .text { white-space: pre-wrap; line-height: 1.4; }
        .feedback { margin-top: 6px; }
        .feedback button { background: none; border: 1px solid #ccc; border-radius: 4px; padding: 2px 8px; cursor: pointer; margin-right: 6px; font-size: 13px; }
        .feedback button.selected { background: #0b4f4a; color: white; border-color: #0b4f4a; }
        .input-row { display: flex; gap: 8px; }
        #question { flex: 1; padding: 10px; font-size: 14px; }
        #send { padding: 10px 18px; cursor: pointer; }
        .error { color: #b00020; }
        .loading { color: #888; font-style: italic; }
    </style>
</head>
<body>
    <h2>Mental Health FAQ Assistant</h2>
    <div class="subtitle">Ask a question — answers are grounded in a curated mental health FAQ corpus.</div>

    <div id="chat"></div>

    <div class="input-row">
        <input type="text" id="question" placeholder="e.g. What is MSP?" autocomplete="off" />
        <button id="send">Send</button>
    </div>

    <script>
        const chat = document.getElementById("chat");
        const input = document.getElementById("question");
        const sendBtn = document.getElementById("send");

        function addUserMessage(text) {
            const div = document.createElement("div");
            div.className = "msg user";
            div.innerHTML = `<div class="who">You</div><div class="text"></div>`;
            div.querySelector(".text").textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function addAssistantMessage(text, conversationId, isError = false) {
            const div = document.createElement("div");
            div.className = "msg assistant";
            const textClass = isError ? "text error" : "text";
            div.innerHTML = `<div class="who">Assistant</div><div class="${textClass}"></div>`;
            div.querySelector(".text").textContent = text;

            if (conversationId && !isError) {
                const feedbackDiv = document.createElement("div");
                feedbackDiv.className = "feedback";
                feedbackDiv.innerHTML = `
                    <button data-value="1">👍 Helpful</button>
                    <button data-value="-1">👎 Not helpful</button>
                `;
                feedbackDiv.querySelectorAll("button").forEach((btn) => {
                    btn.addEventListener("click", async () => {
                        const value = parseInt(btn.dataset.value, 10);
                        await sendFeedback(conversationId, value);
                        feedbackDiv.querySelectorAll("button").forEach((b) => b.classList.remove("selected"));
                        btn.classList.add("selected");
                    });
                });
                div.appendChild(feedbackDiv);
            }

            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return div;
        }

        async function sendFeedback(conversationId, feedback) {
            try {
                await fetch("/feedback", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ conversation_id: conversationId, feedback }),
                });
            } catch (err) {
                console.error("Failed to send feedback:", err);
            }
        }

        async function sendQuestion() {
            const question = input.value.trim();
            if (!question) return;

            addUserMessage(question);
            input.value = "";
            sendBtn.disabled = true;

            const loadingDiv = addAssistantMessage("Thinking...", null);
            loadingDiv.querySelector(".text").classList.add("loading");

            try {
                const response = await fetch("/question", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question }),
                });
                const data = await response.json();

                loadingDiv.remove();

                if (!response.ok) {
                    addAssistantMessage(data.error || "Something went wrong.", null, true);
                } else {
                    addAssistantMessage(data.answer, data.conversation_id);
                }
            } catch (err) {
                loadingDiv.remove();
                addAssistantMessage("Could not reach the server. Is it still running?", null, true);
            } finally {
                sendBtn.disabled = false;
            }
        }

        sendBtn.addEventListener("click", sendQuestion);
        input.addEventListener("keypress", (e) => {
            if (e.key === "Enter") sendQuestion();
        });
    </script>
</body>
</html>
